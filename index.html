<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة الألعاب من ملف JSON</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 950px;
            margin: auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            color: #00adb5;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: #252525;
            padding: 15px;
            border-radius: 8px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .search-box, .add-box {
            display: flex;
            gap: 10px;
            width: 48%;
        }
        @media (max-width: 768px) {
            .search-box, .add-box {
                width: 100%;
            }
        }
        input[type="text"] {
            padding: 10px;
            width: 100%;
            border: 1px solid #444;
            background: #333;
            color: #fff;
            border-radius: 5px;
        }
        button {
            padding: 10px 15px;
            background-color: #00adb5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
        }
        button:hover {
            background-color: #00818a;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid #333;
        }
        th {
            background-color: #252525;
            color: #00adb5;
        }
        tr:hover {
            background-color: #2a2a2a;
        }
        .checkbox-container {
            text-align: center;
        }
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .stats {
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.1em;
            color: #ff5722;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>قائمة الألعاب الشاملة</h1>
    
    <div class="stats" id="statsText">جاري التحميل...</div>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن اسم لعبة..." onkeyup="filterGames()">
        </div>
        <div class="add-box">
            <input type="text" id="gameNameInput" placeholder="أدخل اسم لعبة جديدة...">
            <button onclick="addNewGame()">إضافة</button>
        </div>
    </div>

    <div class="top-bar">
        <span id="resultCount" style="color: #aaa; font-size: 0.9em;"></span>
        <button onclick="resetData()" style="background-color: #d9534f;">إعادة تعيين الكل</button>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 80px;">التسلسل</th>
                <th>اسم اللعبة</th>
                <th style="width: 100px; text-align: center;">لعبتها؟</th>
            </tr>
        </thead>
        <tbody id="gamesTableBody">
            <tr><td colspan="3" style="text-align: center;">جاري تحميل الألعاب...</td></tr>
        </tbody>
    </table>
</div>

<script>
    let games = [];

    // جلب البيانات من ملف الـ JSON الخارجي عند فتح الصفحة
    async function loadGamesData() {
        try {
            const response = await fetch('games.json');
            const jsonData = await response.json();
            
            // التحقق من وجود بيانات مخزنة مسبقاً (مربعات الصح التي حددها المستخدم)
            const savedProgress = JSON.parse(localStorage.getItem('my_games_progress')) || {};

            // دمج الالعاب الواردة من الملف مع حالة الصح والخطأ المخزنة محلياً
            games = jsonData.map(game => {
                return {
                    id: game.id,
                    name: game.name,
                    played: savedProgress[game.id] ? true : false
                };
            });

            renderTable(games);
        } catch (error) {
            document.getElementById('gamesTableBody').innerHTML = `<tr><td colspan="3" style="text-align: center; color: #ff5722;">تعذر تحميل ملف games.json. تأكد من تشغيل الصفحة عبر سيرفر محلي (Live Server).</td></tr>`;
        }
    }

    // حفظ حالة الـ Checkbox فقط في الـ LocalStorage لتجنب تضارب الملفات
    function saveProgress() {
        let progressMap = {};
        games.forEach(game => {
            if (game.played) {
                progressMap[game.id] = true;
            }
        });
        localStorage.setItem('my_games_progress', JSON.stringify(progressMap));
        updateStats();
    }

    function updateStats() {
        const playedCount = games.filter(g => g.played).length;
        document.getElementById('statsText').innerText = `تم لعب: ${playedCount} من أصل ${games.length} لعبة`;
    }

    function renderTable(filteredGames = games) {
        const tbody = document.getElementById('gamesTableBody');
        tbody.innerHTML = '';

        if (filteredGames.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #888;">لا توجد نتائج مطابقة للبحث</td></tr>`;
            document.getElementById('resultCount').innerText = `عدد النتائج: 0`;
            return;
        }

        filteredGames.forEach((game) => {
            const tr = document.createElement('tr');
            const originalIndex = games.findIndex(g => g.id === game.id);
            
            tr.innerHTML = `
                <td>${game.id}</td>
                <td>${game.name}</td>
                <td class="checkbox-container">
                    <input type="checkbox" ${game.played ? 'checked' : ''} onchange="togglePlayed(${originalIndex})">
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('resultCount').innerText = `عرض ${filteredGames.length} من ${games.length} لعبة`;
        updateStats();
    }

    function togglePlayed(index) {
        games[index].played = !games[index].played;
        saveProgress();
        filterGames();
    }

    function filterGames() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        if (query === "") {
            renderTable(games);
        } else {
            const filtered = games.filter(g => g.name.toLowerCase().includes(query));
            renderTable(filtered);
        }
    }

    function addNewGame() {
        const input = document.getElementById('gameNameInput');
        const gameName = input.value.trim();
        
        if (gameName === '') {
            alert('الرجاء كتابة اسم اللعبة!');
            return;
        }

        const newId = games.length > 0 ? Math.max(...games.map(g => g.id)) + 1 : 1;
        games.push({ id: newId, name: gameName, played: false });

        input.value = '';
        saveProgress();
        document.getElementById('searchInput').value = '';
        renderTable(games);
    }

    function resetData() {
        if (confirm('هل أنت متأكد من مسح جميع خيارات الصح؟')) {
            localStorage.removeItem('my_games_progress');
            loadGamesData();
        }
    }

    // تشغيل الدالة عند تحميل الصفحة
    loadGamesData();
</script>

</body>
</html>
